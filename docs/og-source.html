<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8" />
<title>og source</title>
<style>
  @font-face { font-family: "Inter Tight"; font-weight: 400 700; font-display: block; src: url("../fonts/inter-tight-latin.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f5f3ee; font-family: "Inter Tight", sans-serif; color: #17150f; overflow: hidden; }
  .panel { position: absolute; inset: 40px; background: #dfe8dc; border-radius: 40px; overflow: hidden; padding: 64px 72px; box-sizing: border-box; }
  .panel::after { content: ""; position: absolute; right: -10%; top: -35%; width: 58%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(243,201,74,0.32), rgba(243,201,74,0) 62%); }
  h1 { position: relative; margin: 0; font-size: 94px; line-height: 0.96; letter-spacing: -0.04em; font-weight: 700; max-width: 11ch; font-variation-settings: "opsz" 96; }
  .mark { background: #f3c94a; padding: 0 0.14em; margin: 0 -0.03em; border-radius: 0.2em; }
  .sub { position: relative; margin: 30px 0 0; font-size: 28px; line-height: 1.35; color: #4b4741; max-width: 48ch; }
  .foot { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; }
  .foot i { width: 14px; height: 14px; border-radius: 50%; background: #1f3d2b; display: inline-block; }
  .foot span { color: #4b4741; font-weight: 500; }
  .pill { position: absolute; right: 72px; bottom: 52px; background: #1f3d2b; color: #faf8f4; font-weight: 600; font-size: 24px; padding: 16px 30px; border-radius: 999px; }
</style>
</head>
<body>
<div class="panel">
  <h1>I build <span class="mark">AI</span> that runs your business.</h1>
  <p class="sub">AI consulting, automation, and custom software, end to end.</p>
  <div class="foot"><i></i>Rayyan Abzal <span>· rayyanabzal.com</span></div>
  <div class="pill">Book a free call</div>
</div>
</body>
</html>
